version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go-minor-patch:
        update-types: [ minor, patch ]
      go-security:
        # Security updates ignore version-update groups; group them too so one
        # merge does not force a go.sum rebase on the others.
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions-minor-patch:
        update-types: [ minor, patch ]
